name = "noon-assistant-proxy"
main = "worker.js"
# Bumped from 2024-01-01: SQLite-backed Durable Objects need a recent date.
compatibility_date = "2025-03-10"

# Hint to run the Worker near the Anthropic API rather than near the visitor.
# This alone is not enough (it is advisory, and a paid-plan feature), so the
# region-pinned Durable Object below is what actually guarantees the fix.
[placement]
mode = "smart"

# The relay that calls Anthropic. Pinned to North America at runtime via
# locationHint, because a Worker running in an unsupported region (Hong Kong,
# for one) gets 403 "Request not allowed" from api.anthropic.com.
[[durable_objects.bindings]]
name = "RELAY"
class_name = "AnthropicRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AnthropicRelay"]

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "90eff02e375c405b95e59f80b053199e"
